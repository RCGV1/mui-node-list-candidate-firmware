name: Build candidate firmware

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FIRMWARE_REPO: RCGV1/firmware-Fork
  FIRMWARE_REF: 6da76d5b60534328928267861273bf6d0b92579e
  DEVICE_UI_REPO: RCGV1/device-ui
  DEVICE_UI_REF: c96113e71e10698c291ebb7c307d68cb1d2d0f7a
  RELEASE_TAG: mui-node-list-20260827-c96113e
  TARGETS: >-
    elecrow-adv-24-28-tft
    elecrow-adv-35-tft
    elecrow-adv1-43-50-70-tft
    heltec-v4-tft
    picomputer-s3-tft
    rak_wismesh_tap_v2-tft
    seeed-sensecap-indicator-tft
    t-deck-tft
    unphone-tft

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - elecrow-adv-24-28-tft
          - elecrow-adv-35-tft
          - elecrow-adv1-43-50-70-tft
          - heltec-v4-tft
          - picomputer-s3-tft
          - rak_wismesh_tap_v2-tft
          - seeed-sensecap-indicator-tft
          - t-deck-tft
          - unphone-tft
    steps:
      - name: Check out firmware
        uses: actions/checkout@v6
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          ref: ${{ env.FIRMWARE_REF }}
          path: firmware

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Pin and verify source provenance
        working-directory: firmware
        run: |
          set -euo pipefail
          sed -i "s#https://github.com/[^/]*/device-ui/archive/[0-9a-f]*\.zip#https://github.com/$DEVICE_UI_REPO/archive/$DEVICE_UI_REF.zip#" platformio.ini
          grep -F "https://github.com/$DEVICE_UI_REPO/archive/$DEVICE_UI_REF.zip" platformio.ini
          grep -F "DEVICE_UI_MUI_VIRTUAL_NODE_LIST" variants/esp32s3/elecrow_panel/platformio.ini
          grep -F "DEVICE_UI_MUI_VIRTUAL_NODE_LIST" variants/esp32s3/heltec_v4/platformio.ini
          grep -F "DEVICE_UI_MUI_VIRTUAL_NODE_LIST" variants/esp32s3/picomputer-s3/platformio.ini
          grep -F "DEVICE_UI_MUI_VIRTUAL_NODE_LIST" variants/esp32s3/rak_wismesh_tap_v2/platformio.ini
          grep -F "DEVICE_UI_MUI_VIRTUAL_NODE_LIST" variants/esp32s3/seeed-sensecap-indicator/platformio.ini
          grep -F "DEVICE_UI_MUI_VIRTUAL_NODE_LIST" variants/esp32s3/t-deck/platformio.ini
          grep -F "DEVICE_UI_MUI_VIRTUAL_NODE_LIST" variants/esp32s3/unphone/platformio.ini

      - name: Build targets
        working-directory: firmware
        run: pio run -e "${{ matrix.target }}"

      - name: Collect firmware assets
        run: |
          set -euo pipefail
          out="release/${{ matrix.target }}"
          mkdir -p "$out"
          cp "firmware/.pio/build/${{ matrix.target }}"/firmware-*.bin "$out/"
          cp "firmware/.pio/build/${{ matrix.target }}"/littlefs-*.bin "$out/" || true
          cp "firmware/.pio/build/${{ matrix.target }}"/*.mt.json "$out/" || true

      - name: Upload target artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: release/${{ matrix.target }}/*
          retention-days: 30

  publish:
    name: publish release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download target artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-input

      - name: Collect release assets
        run: |
          set -euo pipefail
          build_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          out="release/$RELEASE_TAG"
          mkdir -p "$out"
          find release-input -type f -exec cp {} "$out/" \;
          sha256sum "$out"/* > "$out/SHA256SUMS.txt"
          {
            echo "release_tag=$RELEASE_TAG"
            echo "firmware_repo=$FIRMWARE_REPO"
            echo "firmware_ref=$FIRMWARE_REF"
            echo "device_ui_repo=$DEVICE_UI_REPO"
            echo "device_ui_ref=$DEVICE_UI_REF"
            echo "targets=$TARGETS"
            echo "compile_definition=DEVICE_UI_MUI_VIRTUAL_NODE_LIST"
            echo "build_timestamp=$build_timestamp"
          } > "$out/build-source.txt"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_TAG }}
          path: release/${{ env.RELEASE_TAG }}/*
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          {
            echo "MUI virtual node-list tester firmware"
            echo
            echo "Tester-only artifact; not a Meshtastic stable release."
            echo
            echo "- Firmware: $FIRMWARE_REPO@$FIRMWARE_REF"
            echo "- Device UI: $DEVICE_UI_REPO@$DEVICE_UI_REF"
            echo "- Targets: $TARGETS"
            echo "- Required compile definition: DEVICE_UI_MUI_VIRTUAL_NODE_LIST"
          } > "$notes"
          gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MUI virtual node-list tester firmware (all MUI targets)" \
            --notes-file "$notes" \
            "release/$RELEASE_TAG"/*
